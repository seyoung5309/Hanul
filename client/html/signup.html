<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한울</title>
    <link rel="stylesheet" href="../css/signup-design.css">
</head>

<body>
<div class="signup-container">
    <h1 class="logo">한울</h1>
    <h2 class="signup-title">회원 가입</h2>

    <form action="#" method="POST">
        <div class="input-group">
            <label for="email">이메일</label>
            <input type="email" id="email" placeholder="이메일을 입력해 주세요.">
        </div>
        <div class="input-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" placeholder="비밀번호를 입력해 주세요.">
        </div>
        <div class="input-group">
            <label for="password">비밀번호 재입력</label>
            <input type="password" id="re_password" placeholder="비밀먼호를 입력해 주세요.">
        </div>
        <button type="submit" class="next-button">다음으로</button>
    </form>

    <div class="login-link">
        <a href="login.html">이미 회원이라면?</a>
        <a href="login.html">로그인하기</a>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한울</title>
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="stylesheet" href="../css/signup-design.css">
</head>

<body>
<div class="signup-container">
    <h1 class="logo"><img src="../assets/logo.svg" alt="한울"></h1>
    <h2 class="signup-title">회원 가입</h2>

    <form id="signupArea">
        <div class="input-group">
            <label for="email">이메일</label>
            <input type="email" id="email" placeholder="이메일을 입력해 주세요.">
        </div>
        <div class="input-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" placeholder="비밀번호를 입력해 주세요.">
        </div>
        <div class="input-group">
            <label for="password">비밀번호 재입력</label>
            <input type="password" id="re_password" name="re_password" placeholder="비밀번호를 입력해 주세요.">
        </div>
        <p class="form-error" role="alert"></p>
        <button type="submit" class="next-button">다음으로</button>
    </form>

    <div class="login-link">
        <a href="login.html">이미 회원이라면</a>
        <a href="login.html">로그인하기</a>
    </div>
</div>
<script>
    // UD-001 1단계: 이메일·비밀번호를 확인하고 2단계로 넘긴다. (가입은 2단계에서)
    const signupArea = document.getElementById('signupArea');
    const errorText = signupArea.querySelector('.form-error');

    signupArea.addEventListener('submit', async function(e) {
        e.preventDefault()

        const emailValue = document.getElementById('email').value.trim();
        const passwordValue = document.getElementById('password').value;
        const rePasswordValue = document.getElementById('re_password').value;

        errorText.textContent = '';
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailValue)) {
            errorText.textContent = '이메일 형식을 확인해 주세요.';
            return;
        }
        if (passwordValue.length < 8 || passwordValue.length > 64) {
            errorText.textContent = '비밀번호는 8~64자로 입력해 주세요.';
            return;
        }
        if (passwordValue !== rePasswordValue) {
            errorText.textContent = '비밀번호가 서로 다릅니다.';
            return;
        }

        const res = await fetch('/api/users/check?email=' + encodeURIComponent(emailValue));
        const data = await res.json().catch(() => null);
        if (!res.ok || !data?.emailAvailable) {
            errorText.textContent = data?.message ?? '이미 사용 중인 이메일입니다.';
            return;
        }

        // 2단계에서 함께 보낸다. (탭을 닫으면 사라짐)
        sessionStorage.setItem('signup', JSON.stringify({ email: emailValue, password: passwordValue }));
        location.href = 'signup2.html';
    });
</script>
</body>
</html>

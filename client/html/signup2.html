<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한울 회원가입</title>
    <link rel="stylesheet" href="../css/signup2-design.css">
 </head>

<body>

<div class="signup-container">
    <h1 class="logo">한울</h1>
    <h2 class="page-title">회원 가입</h2>

    <form action="#" method="POST">
        <div class="row-group">
            <div class="col-name input-group">
                <label for="username">이름</label>
                <input type="text" id="username" placeholder="홍길동">
            </div>

            <div class="col-id input-group">
                <label for="userid">아이디</label>
                <div class="id-input">
                    <input type="text" id="userid" placeholder="아이디를 입력해주세요">
                    <button type="button" class="check-btn">중복 확인</button>
                </div>
            </div>
        </div>

        <div class="input-group">
            <label>성별</label>
            <div class="gender-group">
                <button type="button" class="gender-btn">남성</button>
                <button type="button" class="gender-btn">여성</button>
            </div>
        </div>

        <div class="row-group">
            <div class="col-half input-group">
                <label for="enroll-year">입학년도</label>
                <input type="text" id="enroll-year" placeholder="ex) 2025">
            </div>

            <div class="col-half input-group">
                <label for="student-id">학번</label>
                <input type="text" id="student-id" placeholder="ex) 2514">
            </div>
        </div>

        <button type="submit" class="signup-btn">회원 가입</button>
    </form>

    <div class="login-link-group">
        <a href="login.html">이미 회원이라면?</a>
        <a href="login.html">로그인하기</a>
    </div>
</div>

</body>

</html>

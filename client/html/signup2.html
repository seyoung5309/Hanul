<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한울 회원가입</title>
    <link rel="stylesheet" href="../css/signup2-design.css">
 </head>

<body>

<div class="signup-container">
    <h1 class="logo">한울</h1>
    <h2 class="page-title">회원 가입</h2>

    <form id="signup2Area">
        <div class="row-group">
            <div class="col-name input-group">
                <label for="username">이름</label>
                <input type="text" id="username" name="username" placeholder="홍길동">
            </div>

            <div class="col-id input-group">
                <label for="userid">아이디</label>
                <div class="id-input">
                    <input type="text" id="userid" name="userid" placeholder="아이디를 입력해주세요">
                    <button type="button" class="check-btn">중복 확인</button>
                </div>
            </div>
        </div>

        <div class="input-group">
            <label>성별</label>
            <div class="gender-group">
                <button type="button" class="gender-btn" onclick="btnClick(this)">남성</button>
                <button type="button" class="gender-btn" onclick="btnClick(this)">여성</button>
            </div>
        </div>

        <div class="row-group">
            <div class="col-half input-group">
                <label for="enroll-year">입학년도</label>
                <input type="text" id="enroll-year" name="enroll-year" maxlength="4" placeholder="ex) 2025">
            </div>

            <div class="col-half input-group">
                <label for="student-id">학번</label>
                <input type="text" id="student-id" name="student-id" maxlength="4" placeholder="ex) 2514">
            </div>
        </div>

        <button type="submit" class="signup-btn">회원 가입</button>
    </form>

    <div class="login-link-group">
        <a href="login.html">이미 회원이라면?</a>
        <a href="login.html">로그인하기</a>
    </div>
</div>
<script>
    function btnClick(click_button) {
        const button = document.querySelectorAll('.gender-btn');
        button.forEach(btn => btn.classList.remove('active'));
        click_button.classList.add('active');
    }

        const signup2Area = document.getElementById('signup2Area');
        signup2Area.addEventListener('submit', async function(e) {
        e.preventDefault()

        const nameValue = document.getElementById('username').value;
        const idValue = document.getElementById('userid').value;
        const enrollValue = document.getElementById('enroll-year').value;
        const studentValue = document.getElementById('student-id').value;

        const giving = {
        username: nameValue,
        userid: idValue,
        enroll: enrollValue,
        student: studentValue,
    };

        await fetch('/api/submit', {
        method: 'POST',
        headers: {
        'Content-Type': 'application/json'
    },
        body: JSON.stringify(giving)
    });
    });
</script>
</body>

</html>

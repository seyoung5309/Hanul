<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한울 회원가입</title>
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="stylesheet" href="../css/signup2-design.css">
 </head>

<body>

<div class="signup-container">
    <h1 class="logo"><img src="../assets/logo.svg" alt="한울"></h1>
    <h2 class="page-title">회원 가입</h2>

    <form id="signup2Area">
        <div class="row-group">
            <div class="col-name input-group">
                <label for="username">이름</label>
                <input type="text" id="username" name="username" placeholder="홍길동">
            </div>

            <div class="col-id input-group">
                <label for="userid">아이디</label>
                <div class="id-input">
                    <input type="text" id="userid" name="userid" placeholder="아이디를 입력해주세요">
                    <button type="button" class="check-btn">중복 확인</button>
                </div>
            </div>
        </div>

        <div class="input-group">
            <label>성별</label>
            <div class="gender-group">
                <button type="button" class="gender-btn" data-gender="male" onclick="btnClick(this)">남성</button>
                <button type="button" class="gender-btn" data-gender="female" onclick="btnClick(this)">여성</button>
            </div>
        </div>

        <div class="row-group">
            <div class="col-half input-group">
                <label for="enroll-year">입학년도</label>
                <input type="text" id="enroll-year" name="enroll-year" maxlength="4" placeholder="ex) 2025">
            </div>

            <div class="col-half input-group">
                <label for="student-id">학번</label>
                <input type="text" id="student-id" name="student-id" maxlength="4" placeholder="ex) 2514">
            </div>
        </div>

        <label class="agree">
            <input type="checkbox" id="agree-terms">
            개인정보 수집·이용에 동의합니다. (필수)
        </label>
        <p class="form-error" role="alert"></p>
        <button type="submit" class="signup-btn">회원 가입</button>
    </form>

    <div class="login-link-group">
        <a href="login.html">이미 회원이라면</a>
        <a href="login.html">로그인하기</a>
    </div>
</div>
<script>
    // UD-001 2단계: 1단계 이메일·비밀번호와 함께 가입 → 메인으로
    const step1 = JSON.parse(sessionStorage.getItem('signup') || 'null');
    if (!step1) location.replace('signup.html');

    const signup2Area = document.getElementById('signup2Area');
    const errorText = signup2Area.querySelector('.form-error');
    let checkedId = null; // 중복 확인을 통과한 아이디

    function btnClick(click_button) {
        const button = document.querySelectorAll('.gender-btn');
        button.forEach(btn => btn.classList.remove('active'));
        click_button.classList.add('active');
    }

    // UD-002 아이디 중복 확인
    document.querySelector('.check-btn').addEventListener('click', async function() {
        const idValue = document.getElementById('userid').value.trim();
        errorText.textContent = '';
        if (!/^[A-Za-z0-9_]{4,16}$/.test(idValue)) {
            errorText.textContent = '아이디는 영문, 숫자, _ 조합 4~16자로 입력해 주세요.';
            return;
        }
        const res = await fetch('/api/users/check?identifier=' + encodeURIComponent(idValue));
        const data = await res.json().catch(() => null);
        if (res.ok && data?.identifierAvailable) {
            checkedId = idValue;
            errorText.textContent = '';
            this.textContent = '확인 완료';
        } else {
            checkedId = null;
            errorText.textContent = data?.message ?? '이미 사용 중인 아이디입니다.';
        }
    });
    document.getElementById('userid').addEventListener('input', function() {
        checkedId = null;
        document.querySelector('.check-btn').textContent = '중복 확인';
    });

    signup2Area.addEventListener('submit', async function(e) {
        e.preventDefault()

        const nameValue = document.getElementById('username').value.trim();
        const idValue = document.getElementById('userid').value.trim();
        const enrollValue = document.getElementById('enroll-year').value.trim();
        const studentValue = document.getElementById('student-id').value.trim();
        const genderValue = document.querySelector('.gender-btn.active')?.dataset.gender ?? null;

        errorText.textContent = '';
        if (idValue !== checkedId) {
            errorText.textContent = '아이디 중복 확인을 해 주세요.';
            return;
        }
        if (!document.getElementById('agree-terms').checked) {
            errorText.textContent = '개인정보 수집·이용에 동의해 주세요.';
            return;
        }

        const giving = {
            email: step1.email,
            password: step1.password,
            name: nameValue,
            identifier: idValue,
            gender: genderValue,
            admissionYear: enrollValue,
            studentNumber: studentValue,
            agreeTerms: true,
        };

        const res = await fetch('/api/users/signup', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(giving)
        });
        if (res.ok) {
            sessionStorage.removeItem('signup');
            location.href = 'main.html';
            return;
        }
        const data = await res.json().catch(() => null);
        errorText.textContent = data?.message ?? '회원가입에 실패했습니다.';
    });
</script>
</body>

</html>

<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한울 - 스터디룸</title>
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="stylesheet" href="../css/study-room.css">
</head>

<body>
    <main class="container">
        <div class="col-left">
            <section class="room-section room-section--recent">
                <h2 class="section-title">최근 자주 방문한 스터디룸</h2>
                <div class="room-grid"><!-- js/pages/study-room.js가 채움 -->
                </div>
            </section>
            <section class="room-section room-section--mine">
                <div class="section-head">
                    <h2 class="section-title">내가 만든 스터디룸</h2>
                    <button type="button" class="section-head__btn room-create-open">스터디룸 생성하기</button>
                </div>
                <div class="room-grid"><!-- js/pages/study-room.js가 채움 -->
                </div>
            </section>
            <section class="room-section room-section--joined">
                <h2 class="section-title">내가 참여한 스터디룸</h2>
                <div class="room-grid"><!-- js/pages/study-room.js가 채움 -->
                </div>
            </section>
        </div>

        <div class="col-right">
            <div class="card profile">
                <div class="profile__head">
                    <div class="profile__user">
                        <div class="profile__avatar"></div>
                        <div class="profile__info">
                            <p class="profile__name">이미림</p>
                            <p class="profile__class">0학년 0반 0번</p>
                        </div>
                    </div>
                    <div class="profile__links">
                        <a href="#" class="profile__link">프로필 바로가기</a>
                        <a href="#" class="profile__logout">로그아웃 <img src="../assets/logout.svg" alt=""></a>
                    </div>
                </div>
                <div class="profile__stats">
                    <p class="profile__stats-title">통계</p>
                    <div class="profile__stat">
                        <p class="label">총 공부 시간</p>
                        <p class="profile__time">00시간 00분 00초</p>
                    </div>
                    <div class="profile__stat">
                        <p class="label">가장 많이 공부한 분야</p>
                        <div class="tags">
                            <span class="tag">CS</span>
                            <span class="tag">OS</span>
                            <span class="tag">미적분 1</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card notice">
                <h2 class="card__title">읽지 않은 알림</h2>
                <div class="chips">
                    <button class="chip chip--active">채팅</button>
                    <button class="chip">공지사항</button>
                </div>
                <ul class="list"><!-- js/notice-card.js가 채움 -->
                </ul>
            </div>
        </div>
    </main>

    <!-- 스터디룸 생성하기 (Figma: 화면 아래에서 올라오는 창) -->
    <dialog class="room-dialog">
        <form class="room-dialog__form" method="dialog">
            <h2 class="room-dialog__title">스터디룸 생성하기</h2>
            <div class="room-dialog__fields">
                <label class="room-dialog__field">
                    <span class="room-dialog__label">스터디룸 이름</span>
                    <input type="text" name="title" maxlength="30" placeholder="이름을 입력해 주세요." required>
                </label>
                <label class="room-dialog__field">
                    <span class="room-dialog__label">방 설명</span>
                    <input type="text" name="comment" maxlength="255" placeholder="방 설명을 입력해 주세요.">
                </label>
                <div class="room-dialog__field">
                    <span class="room-dialog__label">분야를 선택해 주세요.</span>
                    <div class="subject-chips"><!-- js/pages/study-room.js가 DB 과목으로 채움 --></div>
                </div>
            </div>
            <p class="room-dialog__error" role="alert"></p>
            <div class="room-dialog__buttons">
                <button type="button" class="room-dialog__cancel">취소하기</button>
                <button type="submit" class="room-dialog__submit">생성하기</button>
            </div>
        </form>
    </dialog>

    <!-- navigate 불러오기 -->
    <div data-include="../component/navigate.html"></div>

    <!-- footer 불러오기 -->
    <div data-include="../component/footer.html"></div>

    <!-- Calendar 불러오기 -->
    <script src="../js/calendar.js"></script>

    <!-- Component 불러오기-->
    <script src="../js/include.js"></script>

    <!-- API 연동 -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/notice-card.js"></script>
    <script src="../js/pages/study-room.js"></script>
</body>

</html>

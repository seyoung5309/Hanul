<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한울</title>
    <link rel="stylesheet" href="../css/login-design.css">
</head>

<body>
<div class="login-container">
    <h1 class="logo">한울</h1>
    <h2 class="login-title">로그인</h2>

    <form action="#" method="POST">
        <div class="input-group">
            <label for="email">이메일</label>
            <input type="email" id="email" placeholder="이메일을 입력해 주세요.">
        </div>
        <div class="input-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" placeholder="비밀번호를 입력해 주세요.">
        </div>
        <button type="submit" class="login-button">로그인</button>
    </form>

    <div class="signup-link">
        <a href="signup.html">아직 회원이 아니라면?</a>
        <a href="signup.html">회원가입하기</a>
    </div>

    <div class="easy-login">
        <p>간편 로그인</p>
        <div class="social-login-group">
            <button type="button" class="social-login" onclick=""></button>
            <button type="button" class="social-login" onclick=""></button>
            <button type="button" class="social-login" onclick=""></button>
        </div>
    </div>
</div>
</body>
</html>

<!doctype html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한울 - 랭킹</title>
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="stylesheet" href="../css/rank-design.css">
</head>

<body data-page="rank">
    <main class="main-wrap">
        <h1 class="title">랭킹</h1>

        <div class="btns">
            <button class="btn on" data-period="day">일간랭킹</button>
            <button class="btn" data-period="month">월간랭킹</button>
            <button class="btn" data-period="week">주간랭킹</button>
            <button class="btn" data-period="all">종합 랭킹</button>
        </div>

        <div class="my-box">
            <div class="box">
                <span class="txt" id="txt1"></span>
                <div class="val">
                    <span class="t-text" id="t1"></span>
                    <span class="r-text" id="r1"></span>
                </div>
            </div>

            <div class="box">
                <span class="txt" id="txt2"></span>
                <div class="val">
                    <span class="t-text" id="t2"></span>
                    <span class="r-text" id="r2"></span>
                </div>
            </div>
        </div>

        <!-- 상위 1~3위 영역 -->
        <section class="top-box">
            <div class="card" id="top2"></div>
            <div class="card first" id="top1"></div>
            <div class="card" id="top3"></div>
        </section>

        <!-- 4~10위 리스트 -->
        <section class="list-box" id="list"></section>
    </main>

    <!-- navigate 불러오기 -->
    <div data-include="../component/navigate.html"></div>

    <!-- footer 불러오기 -->
    <div data-include="../component/footer.html"></div>

    <!-- Component 불러오기-->
    <script src="../js/include.js"></script>

    <!-- API 연동 -->
    <script src="../js/api.js"></script>
    <script>
        // ST-005: 학생 랭킹(1~10위)과 내 순위, 우리 반 순위
        const { api, formatHMS, el } = Hanul;

        // 프로필 원: 사진이 있으면 사진으로
        function circle(img) {
            const node = el("div", "circle");
            if (img) node.style.background = `center / cover url("${img}")`;
            return node;
        }

        function setMyBox(n, label, me) {
            document.getElementById("txt" + n).textContent = label;
            document.getElementById("t" + n).textContent = formatHMS(me?.seconds ?? 0);
            document.getElementById("r" + n).textContent = me?.rank ? `${me.rank}위` : "-";
        }

        function setTopCard(card, rank, item) {
            card.replaceChildren(el("span", "num", rank), circle(item?.img),
                el("span", "s-id", item?.studentNumber ?? ""),
                el("span", "s-name", item?.name ?? "-"),
                el("span", "s-time", item ? formatHMS(item.seconds) : ""));
        }

        function listItem(item) {
            const info = el("div", "info");
            info.append(el("span", "id-txt", item.studentNumber ?? ""), el("span", "name-txt", item.name));
            const left = el("div", "left");
            left.append(el("span", "n", item.rank), circle(item.img), info);
            const row = el("div", "item");
            row.append(left, el("span", "time-txt", formatHMS(item.seconds)));
            return row;
        }

        function setPage(students, classes) {
            setMyBox(1, "나의 공부 시간", students.me);
            setMyBox(2, "우리 반 공부 시간", classes.me);

            const arr = students.items;
            setTopCard(document.getElementById("top1"), 1, arr[0]);
            setTopCard(document.getElementById("top2"), 2, arr[1]);
            setTopCard(document.getElementById("top3"), 3, arr[2]);
            document.querySelector(".top-box").hidden = arr.length === 0;

            const list = document.getElementById("list");
            list.replaceChildren(...arr.slice(3).map(listItem));
            if (arr.length === 0) {
                list.append(el("p", "txt", students.hidden ? "랭킹 보기를 꺼 두었습니다." : "아직 공부 기록이 없습니다."));
            }
        }

        async function loadData(period) {
            try {
                const [students, classes] = await Promise.all([
                    api("GET", `/study/ranking?scope=student&period=${period}&limit=10`),
                    api("GET", `/study/ranking?scope=class&period=${period}&limit=10`),
                ]);
                setPage(students, classes);
            } catch (e) {
                console.log(e);
            }
        }

        document.querySelectorAll(".btn").forEach((btn) => {
            btn.addEventListener("click", () => {
                document.querySelectorAll(".btn").forEach((b) => b.classList.toggle("on", b === btn));
                loadData(btn.dataset.period);
            });
        });

        loadData("day");
    </script>
</body>

</html>

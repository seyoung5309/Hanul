<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한울</title>
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="stylesheet" href="../css/room.css">
</head>

<body>
    <main class="room">
        <header class="room__header">
            <a href="study-room.html" class="room__back"><img src="../assets/arrow-back.svg" alt="뒤로가기"></a>
            <h1 class="room__title"></h1>
            <div class="room__study">
                <select class="room__subject" aria-label="공부할 과목"></select>
                <button type="button" class="room__study-btn">공부 시작</button>
            </div>
        </header>

        <div class="room__content">
            <div class="timer">
                <div class="timer__item">
                    <p class="timer__label">총합 공부 시간</p>
                    <p class="timer__num timer__num--total">00:00:00</p>
                </div>
                <div class="timer__item">
                    <p class="timer__label">나의 공부 시간</p>
                    <p class="timer__num timer__num--mine">00:00:00</p>
                </div>
            </div>

            <div class="chat">
                <!-- 채팅은 다음 작업에서 연동 -->
                <ul class="chat__messages"></ul>
                <form class="chat__form" onsubmit="return false;">
                    <div class="chat__input">
                        <input type="text" placeholder="채팅은 준비 중입니다" disabled>
                        <div class="chat__buttons">
                            <button type="button" disabled><img src="../assets/plus.svg" alt="첨부"></button>
                            <button type="submit" disabled><img src="../assets/send.svg" alt="전송"></button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- 3시간마다 응답 확인 (ST-003) -->
    <div class="study-check" hidden>
        <div class="study-check__box">
            <p class="study-check__title">아직 공부 중인가요?</p>
            <p class="study-check__text"><span class="study-check__count">30</span>초 안에 응답이 없으면 공부가 종료됩니다.</p>
            <button type="button" class="study-check__btn">응답</button>
        </div>
    </div>

    <!-- navigate 불러오기 -->
    <div data-include="../component/navigate.html"></div>

    <!-- Component 불러오기-->
    <script src="../js/include.js"></script>

    <!-- API 연동 (socket.io.js는 서버가 제공) -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/pages/room.js"></script>
</body>

</html>

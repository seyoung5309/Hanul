<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/main.css">
    <title>Document</title>
</head>

<body>
    <nav>
        <img class="main" src="../assets/logo.png">
    </nav>
    <div class="main_box">
        <div class="first_box">
            <div>
                <div class="img_box">
                    <div class="button_box">
                        <img class="main_button" src="../assets/main_button_left.png">
                        <img class="main_button" src="../assets/main_button_right.png">
                    </div>
                </div>
            </div>
            <div class="pre_profile">
                <div class="pre_profile_top">
                    <div class="pre_profile_left">
                        <div class="pre_profile_img"></div>
                        <div class="pre_profile_pro">
                            <label class="text" style="align-self: stretch; font-size: 24px">이름</label>
                            <label class="pre_profile_info">0학년 0반 0번</label>
                        </div>
                    </div>
                    <div class="pre_profile_right">
                        <label class="profile_go">프로필 바로가기</label>
                        <div class="logout_box">
                            <label class="logout">로그아웃</label>
                            <img src="../assets/logout.png">
                        </div>
                    </div>
                </div>
                <div class="pre_profile_bottom">
                    <label class="text" style="font-size: 20px">통계</label>
                    <label class="text" style="font-size: 16px">총 공부 시간</label>
                    <label class="text" style="font-size: 24px">00시간 00분 00초</label>
                    <label class="text" style="font-size: 16px">가장 많이 공부한 분야</label>
                    <div class="many_study_major_box">
                        <button class="many_study_major">CS</button>
                        <button class="many_study_major">OS</button>
                        <button class="many_study_major">미적분 1</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
